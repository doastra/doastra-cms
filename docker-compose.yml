# Local / single-server setup:  docker compose up -d   then   docker compose exec cms npm run seed
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doastra_cms
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cms:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      DATABASE_URL: postgres://postgres:postgres@db:5432/doastra_cms
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@doastra.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - uploads:/app/server/uploads

volumes:
  pgdata:
  uploads:
